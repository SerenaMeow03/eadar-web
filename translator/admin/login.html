<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - 谊达翻译</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 200px;
            height: auto;
            margin-bottom: 16px;
        }
        .logo h1 {
            color: #1a1a2e;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .logo p {
            color: #999;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 26, 46, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <img src="../images/logo-blue.png" alt="谊达翻译">
            <p>管理员后台</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>
        <div class="back-link">
            <a href="../login.html">← 返回译员登录</a>
        </div>
    </div>

    <script>
        // 默认管理员账号
        const defaultAdmin = {
            username: 'admin',
            password: '123456'
        };

        // 获取管理员账号（优先从 localStorage 读取，否则使用默认）
        function getAdminAccount() {
            const stored = localStorage.getItem('adminAccount');
            if (stored) {
                return JSON.parse(stored);
            }
            // 首次使用，保存默认账号到 localStorage
            localStorage.setItem('adminAccount', JSON.stringify(defaultAdmin));
            return defaultAdmin;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const adminAccount = getAdminAccount();
            if (username === adminAccount.username && password === adminAccount.password) {
                // 登录成功，保存管理员信息
                localStorage.setItem('currentAdmin', JSON.stringify({
                    username: username,
                    role: 'admin'
                }));
                // 跳转到管理后台
                window.location.href = 'dashboard.html';
            } else {
                alert('用户名或密码错误');
            }
        });
    </script>
</body>
</html>
