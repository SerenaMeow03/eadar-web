[build]
  publish = "."

[build.environment]
  # 关掉 Netlify 默认的 secret scanning。
  # 原因：我们的 anon key 和 Supabase URL 必须在前端 HTML 里使用（这是设计如此，
  # anon key 在 Supabase 设计上就是公开的），scanner 误判为密钥。
  # 真正的密钥 (SUPABASE_SERVICE_ROLE_KEY) 只在 Netlify Functions 后端通过环境变量读取，永远不会出现在前端代码里。
  SECRETS_SCAN_ENABLED = "false"

# ===== 译员短路径兼容层（2026-09-18 整理结构后保留）=====
# 原因：commit 3ecc8bf0 把 portal/{login,orders,profile}.html git mv 到 portal/translator/
# 但浏览器历史/书签/旧邮件链接可能引用旧短路径
# 用 200 rewrite 保留短 URL 风格（地址栏不变），服务端实际返回新位置
# 注意：这 3 条必须放在 /portal/* 通配规则前面（Netlify 先匹配先赢）
[[redirects]]
  from = "/portal/orders.html"
  to = "/portal/translator/orders.html"
  status = 200

[[redirects]]
  from = "/portal/profile.html"
  to = "/portal/translator/profile.html"
  status = 200

[[redirects]]
  from = "/portal/login.html"
  to = "/portal/translator/login.html"
  status = 200

# SPA 路由支持 - 确保刷新页面正常工作
[[redirects]]
  from = "/portal/*"
  to = "/portal/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/portal/admin/:splat"
  status = 200

[[redirects]]
  from = "/client/*"
  to = "/portal/client/:splat"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/en/:splat"
  status = 200

# ===== 兼容层：旧路径 /translator/* → /portal/*（2026-09-16 重命名后保留 302）=====
# 用途：Netlify Edge / 浏览器历史记录 / 旧书签即使引用旧路径也能跳到新路径
# 长期保留：等所有用户书签/通知/邮件链接迁移完后可删除（建议保留 3 个月）
[[redirects]]
  from = "/translator/*"
  to = "/portal/:splat"
  status = 302

# admin 子域名根路径直接进后台登录页（不影响 marketing 官网）
[[redirects]]
  from = "https://admin.eadartrans.com/"
  to = "/portal/admin/login.html"
  status = 302
  force = false

# 安全性响应头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
